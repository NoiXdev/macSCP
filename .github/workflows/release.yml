name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) — must already exist'
        required: true

permissions:
  contents: write

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Full history + tags are required for conventional-changelog.
          fetch-depth: 0
          # Releases land on main: no PR / status-check rules protect it, so
          # the default GITHUB_TOKEN can push the CHANGELOG commit directly.
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Generate full CHANGELOG.md
        # This is a Swift package with no package.json. conventional-changelog
        # labels the newest section with package.json's version, so synthesize
        # a throwaway one from the tag (never committed).
        run: |
          TAG='${{ github.event.inputs.tag || github.ref_name }}'
          printf '{"name":"macscp","version":"%s"}\n' "${TAG#v}" > package.json
          npx -y conventional-changelog-cli@5 -p conventionalcommits -i CHANGELOG.md -s -r 0
          rm -f package.json
          # conventional-changelog can prepend a blank line; drop any leading
          # blank lines so the file always starts at the first version heading.
          sed -i '/./,$!d' CHANGELOG.md

      - name: Extract latest release notes
        # Slice out just the newest version section for the GitHub Release body.
        run: awk '/^#{1,3} \[?v?[0-9]+\.[0-9]+/{c++} c==1' CHANGELOG.md > RELEASE_NOTES.md

      - name: Commit CHANGELOG back to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Stage first, then check the staged diff: `git diff --quiet` ignores
          # untracked files, so a freshly generated CHANGELOG.md (not yet
          # tracked) would be silently skipped.
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'CHANGELOG.md unchanged — nothing to commit.'
          else
            git commit -m "chore(release): ${{ github.event.inputs.tag || github.ref_name }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md

  build:
    name: Build, sign & notarize (macOS)
    needs: changelog
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Prepare notarization credentials
        run: |
          KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        # scripts/release picks up the API-key env (CI mode) and the version
        # from the tag; notarization waits on Apple's notary service, which
        # can take several minutes with no output — not a hang.
        run: |
          TAG='${{ github.event.inputs.tag || github.ref_name }}'
          MACSCP_VERSION="${TAG#v}" scripts/release

      - name: Clean up notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple_api_key.p8"

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: dist/*.dmg
