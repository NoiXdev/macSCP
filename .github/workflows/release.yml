name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) — must already exist'
        required: true

permissions:
  contents: write

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Full history + tags are required for conventional-changelog.
          fetch-depth: 0
          # Releases land on main: no PR / status-check rules protect it, so
          # the default GITHUB_TOKEN can push the CHANGELOG commit directly.
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Generate full CHANGELOG.md
        # This is a Swift package with no package.json. conventional-changelog
        # labels the newest section with package.json's version, so synthesize
        # a throwaway one from the tag (never committed). TAG comes in via env
        # so untrusted ref names are never interpolated into script text.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          printf '{"name":"macscp","version":"%s"}\n' "${TAG#v}" > package.json
          npx -y conventional-changelog-cli@5 -p conventionalcommits -i CHANGELOG.md -s -r 0
          rm -f package.json
          # conventional-changelog can prepend a blank line; drop any leading
          # blank lines so the file always starts at the first version heading.
          sed -i '/./,$!d' CHANGELOG.md

      - name: Extract latest release notes
        # Slice out just the newest version section for the GitHub Release body.
        run: awk '/^#+ \[?v?[0-9]+\.[0-9]+/{c++} c==1' CHANGELOG.md > RELEASE_NOTES.md

      - name: Commit CHANGELOG back to main
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Stage first, then check the staged diff: `git diff --quiet` ignores
          # untracked files, so a freshly generated CHANGELOG.md (not yet
          # tracked) would be silently skipped.
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'CHANGELOG.md unchanged — nothing to commit.'
          else
            git commit -m "chore(release): $TAG [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create / update GitHub Release (draft until the DMG is up)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          # `v*.*.*` also matches a pre-release tag like `v1.1.0-beta.1`
          # (M11b final review, Finding M2) — flag it so `/latest` never
          # offers a pre-release to stable users.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}

  build:
    name: Build, sign & notarize (macOS)
    needs: changelog
    outputs:
      # The cask's checksum, read off the DMG this job just notarized rather
      # than recomputed later from a download — the tap verifies it again on
      # its side, so a mismatch here is caught before anything is published.
      sha256: ${{ steps.dmg.outputs.sha256 }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # workflow_dispatch runs from a branch ref; build the TAGGED source
          # either way so a re-dispatch can never ship a moved HEAD.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Metal toolchain (Xcode 26+)
        # Measured 2026-09-16: Xcode 27 (27A266a) / Swift 6.4. `swift build`
        # defaults to Swift Build, which compiles SwiftTerm's `Shaders.metal`
        # and fails with "cannot execute tool 'metal' due to missing Metal
        # Toolchain; use: xcodebuild -downloadComponent MetalToolchain"
        # unless the component is already installed. Installing it once with
        # `xcodebuild -downloadComponent MetalToolchain` printed "Done
        # downloading: Metal Toolchain 27A266a." and `xcrun metal --version`
        # then printed "Apple metal version 32023.921 (metalfe-32023.921.6)".
        # This job needs the step only for "Run tests" below: scripts/release
        # calls scripts/package-app, which pins `--build-system native`
        # (commit 3522be3c, so both architecture slices land in one
        # directory) and does not invoke `metal`.
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if xcrun metal --version; then
            echo "Metal toolchain already present."
            exit 0
          fi
          # `xcodebuild -help` is piped into `grep -q` in an earlier version
          # of this step; under `set -o pipefail` a `grep -q` match closes
          # the pipe as soon as it fires, and if xcodebuild is still writing
          # its (24 KB+) help text at that moment it dies of SIGPIPE, which
          # makes the pipeline's exit status non-zero and sends the `if`
          # down the "flag absent" branch even though the flag was there.
          # Not observed with today's 24 KB of help text, reproduced 3/3
          # with a shim whose `-help` prints the flag line first and then
          # 100+ KB more. Capturing the output into a variable first (never
          # itself part of a pipeline `grep` can outrun) avoids the race.
          help_output=$(xcodebuild -help 2>&1 || true)
          if [[ "$help_output" == *-downloadComponent* ]]; then
            if ! xcodebuild -downloadComponent MetalToolchain; then
              echo "::error::could not download the Metal toolchain component (xcodebuild -downloadComponent MetalToolchain)"
              exit 1
            fi
            if ! xcrun metal --version; then
              echo "::error::xcodebuild -downloadComponent MetalToolchain reported success but 'xcrun metal --version' still fails; the MetalToolchain component is still missing."
              exit 1
            fi
          else
            echo "xcodebuild -help does not list -downloadComponent; this Xcode ships Metal in the base toolchain."
          fi

      - name: Run tests
        # A tag can point at any commit — never sign and ship untested code.
        run: swift test

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Prepare notarization credentials
        run: |
          KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        # scripts/release picks up the API-key env (CI mode) and the version
        # from the tag; notarization waits on Apple's notary service, which
        # can take several minutes with no output — not a hang.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          MACSCP_VERSION="${TAG#v}" scripts/release

      - name: Clean up notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple_api_key.p8"

      - name: Checksum the DMG
        id: dmg
        run: |
          set -uo pipefail
          dmg=$(ls dist/*.dmg 2>/dev/null | head -1)
          [ -n "$dmg" ] || { echo "::error::no DMG in dist/ to checksum" >&2; exit 1; }
          echo "Found $dmg"
          echo "sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload DMG and publish the release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: dist/*.dmg
          draft: false
          # Same pre-release flag as the changelog job's release step above
          # (Finding M2) — this step is what actually flips the release out
          # of draft, so it must carry it too.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}

  tap:
    name: Bump the Homebrew cask
    needs: build
    # Homebrew has no concept of a prerelease: whatever lands in the tap is
    # what `brew upgrade` hands every user. Pre-releases therefore skip this
    # and are installed from the releases page instead — the same rule the
    # tap's own README states.
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the bump
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          set -uo pipefail
          [ -n "$SHA" ] || { echo "::error::the build job produced no checksum" >&2; exit 1; }
          for attempt in 1 2 3; do
            if gh workflow run bump.yml --repo NoiXdev/homebrew-tap \
              -f kind=cask \
              -f name=macscp \
              -f version="${TAG#v}" \
              -f sha256="$SHA"; then
              echo "Dispatched on attempt $attempt."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed."
            sleep 10
          done
          exit 1

      # This job runs after the release is already public. A silent failure
      # here leaves the tap pointing at the previous version while its README
      # advertises this one, so say exactly what to run by hand. The tap's
      # SETUP.md records this happening to another product on 2026-09-23.
      - name: Explain how to finish the bump by hand
        if: failure()
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "::error::The tap was not bumped. The release is already published,"
          echo "::error::so 'brew install --cask macscp' still installs the previous version."
          echo "Run it by hand with a token that may dispatch workflows in the tap:"
          echo ""
          echo "  gh workflow run bump.yml --repo NoiXdev/homebrew-tap \\"
          echo "    -f kind=cask -f name=macscp \\"
          echo "    -f version=${TAG#v} -f sha256=${SHA}"
          echo ""
          echo "A 403 here means TAP_TOKEN cannot dispatch in NoiXdev/homebrew-tap."
          echo "See SETUP.md in that repository for what the token needs."
