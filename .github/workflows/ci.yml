name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    # The test runner has hung intermittently since M20: the process sits at
    # 0% CPU and never finishes, so the job would burn the runner's default
    # six-hour budget instead of failing. Green runs take three to four
    # minutes, so 20 leaves ample room for a slow runner while turning a hang
    # into a red build. This is the net, not the fix -- the cause is still
    # open.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Build
        run: swift build
      - name: Unit-Tests
        run: swift test
