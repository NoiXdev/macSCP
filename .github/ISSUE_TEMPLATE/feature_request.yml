name: Feature request
description: Something macSCP should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests are read and kept, and a request that describes the
        situation it came out of is far easier to design for than one that
        names a solution.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        The task, not the feature. "I keep two servers in sync by hand and
        lose track of which side is newer" says more than "add a sync
        button" — it leaves room for an answer nobody has thought of yet.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In macSCP, in another app, or by hand.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A shape you imagine, if you have one.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - File browser
        - Transfers
        - Sessions and connecting
        - Terminal
        - Port forwarding
        - Command-line tool
        - Settings
        - Somewhere else / not sure
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you post
      options:
        - label: I searched the existing issues and this is not already requested.
          required: true
