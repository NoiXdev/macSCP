# macSCP test rig: the integration tests provoke failed logins on purpose
# (wrong password, TOFU reject). Without this setting OpenSSH >= 9.8
# accumulates PerSourcePenalties against 127.0.0.1 and, after many test
# runs, refuses new connections outright ("Disconnected") until the
# container is restarted.
PerSourcePenalties no

# Many rapid, partly unauthenticated test connections must not be dropped
# at random (MaxStartups greylisting).
MaxStartups 100:30:200

# M10c/T1: the jump-host tests need a direct-tcpip channel (ProxyJump,
# Citadel SSHClient.jump(to:)) from the jump container to the target
# container. The base image sets "AllowTcpForwarding no" — without this
# line sshd rejects the channel with "channelSetupRejected" before the
# target authentication even begins.
AllowTcpForwarding yes
