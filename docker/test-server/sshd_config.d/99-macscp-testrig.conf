# macSCP-Testrig: Die Integrationstests provozieren absichtlich Fehl-Logins
# (falsches Passwort, TOFU-Reject). Ohne diese Einstellung akkumuliert
# OpenSSH >= 9.8 PerSourcePenalties gegen 127.0.0.1 und lehnt nach vielen
# Testlaeufen neue Verbindungen sofort ab ("Disconnected"), bis der Container
# neu gestartet wird.
PerSourcePenalties no

# Viele schnell aufeinanderfolgende, teils unauthentifizierte Testverbindungen
# duerfen nicht per Zufalls-Drop (MaxStartups-Greylisting) abgewiesen werden.
MaxStartups 100:30:200
