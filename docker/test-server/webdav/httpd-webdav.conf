# WebDAV test rig (M21/Task 11): three vhosts, one per auth mode
# WebDAVSessionDelegate must handle -- Basic, Digest, and TLS (itself Basic,
# reachable only after the TOFU certificate is accepted). Loaded via the
# `Include conf/extra/webdav.conf` line entrypoint.sh appends to httpd.conf
# at container start, since the base httpd:2.4 image ships every
# conf/extra/* Include commented out.

LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule auth_digest_module modules/mod_auth_digest.so
LoadModule ssl_module modules/mod_ssl.so

DavLockDB "/usr/local/apache2/var/DavLock"

Listen 8080
Listen 8081
Listen 8443

# --- Basic auth, plain HTTP -------------------------------------------
<VirtualHost *:8080>
    ServerName localhost
    Alias /dav /var/dav/basic
    <Directory "/var/dav/basic">
        Dav On
        Options Indexes
        AuthType Basic
        AuthName "macSCP WebDAV (Basic)"
        AuthUserFile /usr/local/apache2/conf/basic.passwd
        Require valid-user
    </Directory>
</VirtualHost>

# --- Digest auth, plain HTTP --------------------------------------------
<VirtualHost *:8081>
    ServerName localhost
    Alias /dav /var/dav/digest
    <Directory "/var/dav/digest">
        Dav On
        Options Indexes
        AuthType Digest
        AuthName "macSCP"
        AuthDigestProvider file
        AuthUserFile /usr/local/apache2/conf/digest.passwd
        AuthDigestDomain /dav/
        Require valid-user
    </Directory>
</VirtualHost>

# --- Basic auth over TLS, self-signed certificate ----------------------
<VirtualHost *:8443>
    ServerName localhost
    SSLEngine On
    SSLCertificateFile /usr/local/apache2/conf/server.pem
    SSLCertificateKeyFile /usr/local/apache2/conf/server.key
    Alias /dav /var/dav/tls
    <Directory "/var/dav/tls">
        Dav On
        Options Indexes
        AuthType Basic
        AuthName "macSCP WebDAV (TLS)"
        AuthUserFile /usr/local/apache2/conf/basic.passwd
        Require valid-user
    </Directory>
</VirtualHost>
