# macSCP test rig, the jump host that forwards NOTHING (2026-09-27).
#
# Same two settings as ../sshd_config.d — the integration tests provoke
# failed logins on purpose, and many rapid connections must not be
# greylisted — and then the one difference this service exists for.
PerSourcePenalties no

# Many rapid, partly unauthenticated test connections must not be dropped
# at random. The three-field form this line used to carry, 100:30:200, did
# exactly that: from 100 unauthenticated connections on, sshd refuses 30%
# of new ones, CHOSEN AT RANDOM. A single number has no such band — every
# connection up to the limit is accepted, and past it refused outright.
#
# Measured 2026-09-27 (docs/BACKLOG.md, "Three SSH-rig cases go red under
# the full gated run"): sshd's own listener counter, which `ps` inside the
# container prints as "N of 100-200 startups", climbs monotonically through
# one gated run - sampled once a second, 0 to 90 over 136 s — because the
# probes connect and close far faster than Docker Desktop's port forwarder
# releases the container side. Above 100 the greylisting band then refuses
# a random 30%, which is the whole of the symptom: a different subset of
# SSH cases red every run, all of them green in isolation.
MaxStartups 1000

# The point of this server. A bastion whose login may forward nothing is
# ordinary (a restricted account, a ForceCommand), and OpenSSH refuses its
# direct-tcpip channel with SSH_OPEN_ADMINISTRATIVELY_PROHIBITED — RFC 4254
# reason code 1, which `DirectTCPIPRejection.reasonCode(inDescription:)`
# reads out of NIOSSH's error text and the diagnosis reports as
# `DiagnosticReason.jumpForwardingProhibited`. The `sshd` service carries
# `AllowTcpForwarding yes` and reaches its target, so it can only ever
# produce code 2; this one produces code 1, and between them the two codes
# the reader distinguishes are both measured against a real server
# (docs/BACKLOG.md, "The jump plan's deferred minors: diagnostics through
# the jump").
#
# Spelled out rather than left to the base image's own default (which is
# `no`, per the comment in ../sshd_config.d): a guard names what it
# watches.
AllowTcpForwarding no
