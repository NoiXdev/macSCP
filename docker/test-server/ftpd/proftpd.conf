# The rig's ProFTPD configuration (FTP plan Task 11). `entrypoint.sh` copies
# this file and appends the port, the passive range and the per-service
# switches (MLSD on/off, the implicit-FTPS listener), so everything below is
# what BOTH services share.
ModulePath /usr/lib/proftpd
LoadModule mod_tls.c

ServerName      "macSCP test rig"
ServerType      standalone
DefaultServer   on
UseIPv6         off
User            nobody
Group           nogroup
MaxInstances    60
Umask           022
AllowOverwrite  on
# REST before STOR as well as before RETR (the latter is the default): the
# resumed-upload case needs both halves.
AllowStoreRestart       on
AllowRetrieveRestart    on
ShowSymlinks    on

# Logged to a file the entrypoint follows, so `docker compose logs` is the
# record (ProFTPD refuses /dev/stderr: it is a symbolic link).
SystemLog       /var/log/proftpd.log
# No control socket and no delay table: neither has a use in a rig, and both
# log an error at start when their directory is absent.
# The wire trace the rig's measurements quote: commands, replies and the TLS
# layer's own account of the data connection.
TraceLog        /var/log/proftpd-trace.log
Trace           tls:10 command:5 response:5
# The login journal the CLI matrix reads (`CLIMatrixFTPITests`, the dial case):
# one line per USER/PASS command, `<command> <user> <reply code>`, written by
# the daemon itself to a file. The session lines of SystemLog are not usable
# for it: measured 2026-11-09, `/var/log/proftpd.log` stays EMPTY while the
# daemon runs in the foreground and every "Login successful" line goes to the
# container's stderr instead.
LogFormat       logins "%m %u %s"
ScoreboardFile  /run/ftpd/proftpd.scoreboard
PidFile         /run/ftpd/proftpd.pid
ControlsEngine  off
DelayEngine     off

# Everything below sits in <Global> so the implicit-FTPS <VirtualHost> the
# entrypoint appends inherits it: a vhost does not inherit the main server's
# authentication or TLS settings by itself.
<Global>
    # Passive data connections are reached through the published ports on
    # loopback, so the address a PASV reply names is the one the host dials.
    MasqueradeAddress 127.0.0.1

    # One virtual user, from files the entrypoint writes. Chrooted into /srv/ftp,
    # which is why the session root the CLI fixture uses is `/`.
    AuthOrder               mod_auth_file.c
    AuthUserFile            /etc/proftpd/ftpd.passwd
    AuthGroupFile           /etc/proftpd/ftpd.group
    RequireValidShell       off
    DefaultRoot             /srv/ftp
    # Stated rather than inherited: a client that idles past these is dropped
    # by the daemon, which a pooled connection's keepalive exists to prevent.
    TimeoutIdle             600
    TimeoutNoTransfer       600

    ExtendedLog             /var/log/proftpd-logins.log AUTH logins

    <IfModule mod_tls.c>
        # Explicit FTPS is OFFERED, never required, so the same port serves the
        # plain cases (CLIMatrix runs `security: .plain`) and the TLS ones.
        TLSEngine               on
        TLSLog                  /var/log/proftpd-tls.log
        TLSProtocol             TLSv1.2 TLSv1.3
        TLSRSACertificateFile       /run/ftpd/cert.pem
        TLSRSACertificateKeyFile    /run/ftpd/key.pem
        TLSRequired             off
        # ProFTPD's default REQUIRES a data connection to resume the control
        # connection's TLS session. Left at the default on purpose: it is the
        # behaviour that the loopback stub's `requiresTLSSessionReuse` exists to
        # imitate, and the rig is where it is checked against a real daemon.
    </IfModule>
</Global>
