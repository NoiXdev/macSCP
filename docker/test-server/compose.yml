services:
  sshd:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd
    ports:
      - "2222:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./seed:/data/seed:ro
      # Das Image aktiviert bei vorhandenem /config/sshd/sshd_config.d
      # automatisch ein Include dafuer (siehe init-openssh-server-config).
      - ./sshd_config.d:/config/sshd/sshd_config.d:ro
