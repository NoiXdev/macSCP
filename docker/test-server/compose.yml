services:
  sshd:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd
    ports:
      - "2222:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./seed:/data/seed:ro
      # The image auto-enables an include for /config/sshd/sshd_config.d
      # when present (see init-openssh-server-config).
      - ./sshd_config.d:/config/sshd/sshd_config.d:ro

  # Second, independent server (M8b/T3) for remote-to-remote streaming
  # tests. Same image pin and config as `sshd`, own empty seed directory,
  # own port and container name so it can run side by side with `sshd`
  # without disturbing its host keys (TOFU pinning in the gated suite).
  sshd2:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-2
    ports:
      - "2223:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./seed2:/data/seed:ro
      - ./sshd_config.d:/config/sshd/sshd_config.d:ro

  # MinIO (M12/T5): thin S3-compatible object store backing the gated S3
  # integration test. Pinned image tags (never `latest`) so the rig is
  # reproducible. Independent of sshd/sshd2 above — left byte-identical.
  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: macscp-test-minio
    command: server /data --console-address ":9001"
    # Host ports are deliberately non-standard (19000/19001, mapped to the
    # container's 9000/9001) to avoid colliding with a MinIO/S3 service a dev
    # machine commonly runs on the default 9000 — same "high, unlikely to
    # clash" spirit as the sshd 2222/2223 mappings above.
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      - MINIO_ROOT_USER=macscp
      - MINIO_ROOT_PASSWORD=macscpsecretkey

  # One-shot seeding: waits for MinIO to accept requests, creates the seed
  # bucket, and puts a couple of objects (incl. one under a "sub/" prefix)
  # so the gated S3FileSystemIntegrationTests can assert both a file and a
  # directory (CommonPrefixes) appear in a root listing.
  #
  # Also (2026-09-02, S3 bucket browser): a second bucket, `macscp-second`,
  # so the bucket-list case is a real two-bucket listing rather than a
  # single-bucket root; and a second S3 identity, `macscp-scoped`, whose
  # policy grants ListBucket/GetObject/PutObject/DeleteObject on
  # `macscp-seed` only and deliberately omits `s3:ListAllMyBuckets` --
  # this is the "key scoped to one bucket, cannot list the account's
  # buckets" case the gated suite needs to exercise. The policy document
  # lives in ./minio/scoped-seed-policy.json, mounted read-only below.
  #
  # Every mc call here is written to be idempotent -- this container reruns
  # on every `docker compose up`, against a MinIO volume that already has
  # last run's state:
  #   - `mc mb --ignore-existing` / `mc pipe` already tolerate a rerun.
  #   - `mc admin user add` and `mc admin policy create` both overwrite in
  #     place, so re-adding the same user/policy is a no-op in effect.
  #   - `mc admin policy attach` is NOT idempotent: MinIO rejects a repeat
  #     attach ("Specified policy update has no net effect") with a
  #     non-zero exit. So it only runs when `mc admin policy entities`
  #     shows the attachment is not already there (verified against a live
  #     rig: first run attaches, a second run with no state change hits the
  #     "already attached" branch and exits 0).
  minio-init:
    image: minio/mc:RELEASE.2024-07-15T17-46-06Z
    container_name: macscp-test-minio-init
    depends_on:
      - minio
    volumes:
      - ./minio/scoped-seed-policy.json:/policies/scoped-seed-policy.json:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 macscp macscpsecretkey; do sleep 1; done &&
      mc mb --ignore-existing local/macscp-seed &&
      echo 'hello a' | mc pipe local/macscp-seed/a.txt &&
      echo 'hello b' | mc pipe local/macscp-seed/sub/b.txt &&
      mc mb --ignore-existing local/macscp-second &&
      echo 'hello second' | mc pipe local/macscp-second/second.txt &&
      mc admin user add local macscp-scoped macscpscopedsecret &&
      mc admin policy create local scoped-seed /policies/scoped-seed-policy.json &&
      attached=\$$(mc admin policy entities local --user macscp-scoped) &&
      case \"\$$attached\" in
        *scoped-seed*) true ;;
        *) mc admin policy attach local scoped-seed --user macscp-scoped ;;
      esac
      "

  # Apache/mod_dav rig (M21/Task 11) backing WebDAVFileSystemIntegrationTests:
  # three vhosts, one per auth mode the WebDAV backend has to handle. Host
  # ports are non-standard 180xx/18443, same "high, unlikely to clash" spirit
  # as the sshd/minio mappings above; verified free with `lsof -i` before
  # settling on them.
  #   18080 -> 8080  Basic auth,  plain HTTP
  #   18081 -> 8081  Digest auth, plain HTTP
  #   18443 -> 8443  Basic auth,  TLS (certificate generated at container
  #                  start by entrypoint.sh -- never committed, exactly like
  #                  the SSH test keys)
  webdav:
    image: httpd:2.4
    container_name: macscp-test-webdav
    ports:
      - "18080:8080"
      - "18081:8081"
      - "18443:8443"
    volumes:
      - ./webdav/httpd-webdav.conf:/usr/local/apache2/conf/extra/webdav.conf:ro
      - ./webdav/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  # Nextcloud (M21/Task 11): exists ONLY to produce one real PROPFIND
  # response to compare against the fixture in WebDAVPropfindParserTests --
  # not part of the gated CRUD suite. Behind a compose profile so the normal
  # `up -d` (and therefore MACSCP_ITEST=1 swift test) stays fast; bring it up
  # explicitly with `docker compose --profile nextcloud up -d nextcloud`.
  nextcloud:
    image: nextcloud:29-apache
    container_name: macscp-test-nextcloud
    profiles: ["nextcloud"]
    ports:
      - "18090:80"
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=testuser
      - NEXTCLOUD_ADMIN_PASSWORD=testpass

  # Host-key-types rig (2026-09-02): one sshd service per host-key type, so
  # the gated host-key-handling tests can pin each type individually.
  # `sshd`/`sshd2` above offer all three types the base image generates at
  # once (rsa, ecdsa P-256, ed25519), so every client negotiates ed25519 --
  # these five services each restrict HostKeyAlgorithms (via their own
  # sshd_config.d-hostkey/<type> include) to exactly one type. Seed-less:
  # the tests only connect, no /data/seed mount is needed. Same image pin
  # and environment as `sshd`/`sshd2`.
  sshd-hostkey-ed25519:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-hostkey-ed25519
    ports:
      - "2231:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./sshd_config.d-hostkey/ed25519:/config/sshd/sshd_config.d:ro

  sshd-hostkey-ecdsa256:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-hostkey-ecdsa256
    ports:
      - "2232:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./sshd_config.d-hostkey/ecdsa256:/config/sshd/sshd_config.d:ro

  # The base image's `ssh-keygen -A` only produces a P-256 ECDSA key, never
  # P-384 -- the custom-cont-init.d hook below (run as root before sshd
  # starts, per the image's documented custom-init support) generates one
  # into the service's own /config volume if absent. That key is never
  # bind-mounted to the host, so nothing generated ends up in the repo.
  sshd-hostkey-ecdsa384:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-hostkey-ecdsa384
    ports:
      - "2233:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./sshd_config.d-hostkey/ecdsa384:/config/sshd/sshd_config.d:ro
      - ./custom-cont-init.d-hostkey/ecdsa384:/custom-cont-init.d:ro

  # Same P-384 rationale as above, for P-521.
  sshd-hostkey-ecdsa521:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-hostkey-ecdsa521
    ports:
      - "2234:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./sshd_config.d-hostkey/ecdsa521:/config/sshd/sshd_config.d:ro
      - ./custom-cont-init.d-hostkey/ecdsa521:/custom-cont-init.d:ro

  sshd-hostkey-rsa:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-hostkey-rsa
    ports:
      - "2235:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./sshd_config.d-hostkey/rsa:/config/sshd/sshd_config.d:ro
