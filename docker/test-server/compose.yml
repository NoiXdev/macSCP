services:
  sshd:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd
    ports:
      - "2222:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./seed:/data/seed:ro
      # The image auto-enables an include for /config/sshd/sshd_config.d
      # when present (see init-openssh-server-config).
      - ./sshd_config.d:/config/sshd/sshd_config.d:ro

  # Second, independent server (M8b/T3) for remote-to-remote streaming
  # tests. Same image pin and config as `sshd`, own empty seed directory,
  # own port and container name so it can run side by side with `sshd`
  # without disturbing its host keys (TOFU pinning in the gated suite).
  sshd2:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-2
    ports:
      - "2223:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./seed2:/data/seed:ro
      - ./sshd_config.d:/config/sshd/sshd_config.d:ro

  # MinIO (M12/T5): thin S3-compatible object store backing the gated S3
  # integration test. Pinned image tags (never `latest`) so the rig is
  # reproducible. Independent of sshd/sshd2 above — left byte-identical.
  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: macscp-test-minio
    command: server /data --console-address ":9001"
    # Host ports are deliberately non-standard (19000/19001, mapped to the
    # container's 9000/9001) to avoid colliding with a MinIO/S3 service a dev
    # machine commonly runs on the default 9000 — same "high, unlikely to
    # clash" spirit as the sshd 2222/2223 mappings above.
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      - MINIO_ROOT_USER=macscp
      - MINIO_ROOT_PASSWORD=macscpsecretkey

  # One-shot seeding: waits for MinIO to accept requests, creates the seed
  # bucket, and puts a couple of objects (incl. one under a "sub/" prefix)
  # so the gated S3FileSystemIntegrationTests can assert both a file and a
  # directory (CommonPrefixes) appear in a root listing.
  minio-init:
    image: minio/mc:RELEASE.2024-07-15T17-46-06Z
    container_name: macscp-test-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 macscp macscpsecretkey; do sleep 1; done &&
      mc mb --ignore-existing local/macscp-seed &&
      echo 'hello a' | mc pipe local/macscp-seed/a.txt &&
      echo 'hello b' | mc pipe local/macscp-seed/sub/b.txt
      "
