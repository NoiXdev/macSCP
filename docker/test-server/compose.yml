services:
  sshd:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd
    ports:
      - "2222:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./seed:/data/seed:ro
      # The image auto-enables an include for /config/sshd/sshd_config.d
      # when present (see init-openssh-server-config).
      - ./sshd_config.d:/config/sshd/sshd_config.d:ro

  # Second, independent server (M8b/T3) for remote-to-remote streaming
  # tests. Same image pin and config as `sshd`, own empty seed directory,
  # own port and container name so it can run side by side with `sshd`
  # without disturbing its host keys (TOFU pinning in the gated suite).
  sshd2:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-2
    ports:
      - "2223:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./seed2:/data/seed:ro
      - ./sshd_config.d:/config/sshd/sshd_config.d:ro

  # The S3 rig (M12/T5; image replaced 2026-09-25): a thin S3-compatible
  # object store backing the gated S3 integration suites. RustFS stands
  # where MinIO stood until `minio/minio` and `minio/mc` were withdrawn
  # from Docker Hub -- `docker pull` answers "pull access denied for
  # minio/minio, repository does not exist", measured 2026-09-25, for the
  # pinned tags and for `latest` alike, so the rig could not start at all.
  # Apache-2.0, run as a test-only container and never linked, exactly like
  # the `sftpgo` service below; THIRD_PARTY_NOTICES.md is generated from
  # `Package.resolved` and covers linked dependencies only, so no rig image
  # belongs in it. Pinned image tags (never `latest`) so the rig is
  # reproducible. Independent of sshd/sshd2 above -- left byte-identical.
  #
  # RustFS serves MinIO's own admin API, which is why the scoped identity's
  # policy document below is the same IAM JSON as before and the gated
  # suites did not have to change: the ports, both bucket names, both key
  # pairs and every refusal they assert are what they were.
  s3:
    image: rustfs/rustfs:1.0.0
    container_name: macscp-test-s3
    # Host ports are deliberately non-standard (19000/19001, mapped to the
    # container's 9000/9001) to avoid colliding with an S3 service a dev
    # machine commonly runs on the default 9000 -- same "high, unlikely to
    # clash" spirit as the sshd 2222/2223 mappings above, and the same two
    # host ports MinIO published here, so nothing that names them moved.
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ACCESS_KEY=macscp
      - RUSTFS_SECRET_KEY=macscpsecretkey
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=:9001

  # One-shot seeding: waits for the store to accept a signed request, then
  # creates two buckets, puts three objects and defines the scoped
  # identity. It reruns on every `docker compose up` against a store that
  # already holds last run's state, so every step in ./s3/init.sh is
  # idempotent; the script says per step why.
  #
  # `macscp-seed` holds `a.txt` and `sub/b.txt`, so the gated
  # S3FileSystemIntegrationTests can assert both a file and a directory
  # (CommonPrefixes) appear in a root listing. `macscp-second` holds
  # `second.txt` (2026-09-02, S3 bucket browser), so the bucket-list case
  # is a real two-bucket listing rather than a single-bucket root.
  #
  # The second identity, `macscp-scoped`, carries a policy granting
  # ListBucket/GetObject/PutObject/DeleteObject on `macscp-seed` only and
  # deliberately omitting `s3:ListAllMyBuckets`. Measured 2026-09-02
  # against MinIO and again 2026-09-25 against RustFS (proofs in
  # README.md): such a key does NOT get AccessDenied on the account-level
  # bucket listing -- the server returns the FILTERED list (macscp-seed
  # only); what it does deny is any access to macscp-second. So the case
  # this identity exercises is "a key that sees one bucket", not "a key
  # that is refused the list". The policy document lives in
  # ./s3/scoped-seed-policy.json, mounted read-only below.
  #
  # `curlimages/curl` rather than a vendor CLI: `minio/mc` went away with
  # the server image, and curl signs SigV4 itself (`--aws-sigv4`). It is
  # the same image `sftpgo-init` below already uses. The credentials stay
  # spelled here, with the rig's other fixture credentials, and reach the
  # script as environment variables.
  s3-init:
    image: curlimages/curl:8.9.1
    container_name: macscp-test-s3-init
    depends_on:
      - s3
    volumes:
      - ./s3/init.sh:/init.sh:ro
      - ./s3/scoped-seed-policy.json:/policies/scoped-seed-policy.json:ro
    environment:
      - S3_URL=http://s3:9000
      - ROOT_KEY=macscp
      - ROOT_SECRET=macscpsecretkey
      - SCOPED_KEY=macscp-scoped
      - SCOPED_SECRET=macscpscopedsecret
    entrypoint: ["/bin/sh", "/init.sh"]

  # Apache/mod_dav rig (M21/Task 11) backing WebDAVFileSystemIntegrationTests:
  # three vhosts, one per auth mode the WebDAV backend has to handle. Host
  # ports are non-standard 180xx/18443, same "high, unlikely to clash" spirit
  # as the sshd/s3 mappings above; verified free with `lsof -i` before
  # settling on them.
  #   18080 -> 8080  Basic auth,  plain HTTP
  #   18081 -> 8081  Digest auth, plain HTTP
  #   18443 -> 8443  Basic auth,  TLS (certificate generated at container
  #                  start by entrypoint.sh -- never committed, exactly like
  #                  the SSH test keys)
  webdav:
    image: httpd:2.4
    container_name: macscp-test-webdav
    ports:
      - "18080:8080"
      - "18081:8081"
      - "18443:8443"
    volumes:
      - ./webdav/httpd-webdav.conf:/usr/local/apache2/conf/extra/webdav.conf:ro
      - ./webdav/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  # Nextcloud (M21/Task 11): exists ONLY to produce one real PROPFIND
  # response to compare against the fixture in WebDAVPropfindParserTests --
  # not part of the gated CRUD suite. Behind a compose profile so the normal
  # `up -d` (and therefore MACSCP_ITEST=1 swift test) stays fast; bring it up
  # explicitly with `docker compose --profile nextcloud up -d nextcloud`.
  nextcloud:
    image: nextcloud:29-apache
    container_name: macscp-test-nextcloud
    profiles: ["nextcloud"]
    ports:
      - "18090:80"
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=testuser
      - NEXTCLOUD_ADMIN_PASSWORD=testpass

  # Host-key-types rig (2026-09-02): one sshd service per host-key type, so
  # the gated host-key-handling tests can pin each type individually.
  # `sshd`/`sshd2` above offer all three types the base image generates at
  # once (rsa, ecdsa P-256, ed25519), so every client negotiates ed25519 --
  # these five services each restrict HostKeyAlgorithms (via their own
  # sshd_config.d-hostkey/<type> include) to exactly one type. Seed-less:
  # the tests only connect, no /data/seed mount is needed. Same image pin
  # and environment as `sshd`/`sshd2`.
  sshd-hostkey-ed25519:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-hostkey-ed25519
    ports:
      - "2231:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./sshd_config.d-hostkey/ed25519:/config/sshd/sshd_config.d:ro

  sshd-hostkey-ecdsa256:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-hostkey-ecdsa256
    ports:
      - "2232:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./sshd_config.d-hostkey/ecdsa256:/config/sshd/sshd_config.d:ro

  # The base image's `ssh-keygen -A` only produces a P-256 ECDSA key, never
  # P-384 -- the custom-cont-init.d hook below (run as root before sshd
  # starts, per the image's documented custom-init support) generates one
  # into the service's own /config volume if absent. That key is never
  # bind-mounted to the host, so nothing generated ends up in the repo.
  sshd-hostkey-ecdsa384:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-hostkey-ecdsa384
    ports:
      - "2233:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./sshd_config.d-hostkey/ecdsa384:/config/sshd/sshd_config.d:ro
      - ./custom-cont-init.d-hostkey/ecdsa384:/custom-cont-init.d:ro

  # Same P-384 rationale as above, for P-521.
  sshd-hostkey-ecdsa521:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-hostkey-ecdsa521
    ports:
      - "2234:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./sshd_config.d-hostkey/ecdsa521:/config/sshd/sshd_config.d:ro
      - ./custom-cont-init.d-hostkey/ecdsa521:/custom-cont-init.d:ro

  sshd-hostkey-rsa:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-hostkey-rsa
    ports:
      - "2235:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./sshd_config.d-hostkey/rsa:/config/sshd/sshd_config.d:ro

  # An OpenSSH server WITHOUT the SFTP subsystem (2026-09-17). A port
  # forwarding needs an authenticated SSH connection and nothing else, so the
  # gated `ForwardingWithoutSFTPITests` prove against this server that a
  # forwarding reaches `active` and carries bytes, while the server refuses a
  # tab's dial its SFTP subsystem. Same image pin, credentials and shared
  # `sshd_config.d` include (`AllowTcpForwarding yes`) as `sshd`; seed-less.
  #
  # The subsystem cannot be removed from an include (sshd keeps the first
  # value it reads, and the image writes `Subsystem sftp` into the main
  # file), so the custom-cont-init.d hook comments it out of
  # /config/sshd/sshd_config -- the container's own volume, nothing written
  # back to this repository. Port 2236: the next one after the host-key
  # services' 2231-2235, not published by any service here and not used by
  # any test (`grep -rn 2236 Tests Sources` was empty on 2026-09-17).
  # Published on loopback only.
  sshd-nosftp:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls230
    container_name: macscp-test-sshd-nosftp
    ports:
      - "127.0.0.1:2236:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
    volumes:
      - ./sshd_config.d:/config/sshd/sshd_config.d:ro
      - ./custom-cont-init.d-nosftp:/custom-cont-init.d:ro

  # SFTPGo (2026-09-02): the rig's only Go-based SSH server. Every other SSH
  # service here is OpenSSH; SFTPGo's server side is `golang.org/x/crypto/ssh`,
  # the library that parses a user-auth public-key blob's leading string as a
  # KEY FORMAT and therefore refuses one typed `rsa-sha2-512` where RFC 8332 §3
  # says `ssh-rsa`. That refusal was measured against the library directly on
  # 2026-09-01 (`docs/superpowers/specs/2026-09-01-backlog-rsa-agent-go-servers.md`);
  # this service is what makes it measurable against a real SERVER, which is
  # what `GoServerRSAIntegrationTests` does.
  #
  # AGPL-3.0-only, run as a test-only container — nothing here links it.
  #
  # Ports: 2240 -> 2022 (SFTP) and 18091 -> 8080 (the admin REST API, which is
  # how a test installs a public key on `testuser`). Both host ports are in the
  # same "high, unlikely to clash" spirit as the sshd/s3/webdav mappings
  # above, and were verified free with `lsof -nP -iTCP:<port> -sTCP:LISTEN`
  # before being settled on.
  #
  # `testuser`'s home directory is the SAME read-only `./seed` mount the `sshd`
  # service serves, so a listing against SFTPGo asserts the same `hello.txt`
  # the OpenSSH suites assert. Read-only is deliberate: a gated test can never
  # write into the repository through this server.
  #
  # The sqlite data provider and the auto-generated host keys live in the
  # container's own `/var/lib/sftpgo` — no bind mount, so no key material can
  # reach the repository.
  sftpgo:
    image: drakkan/sftpgo:v2.6.6
    container_name: macscp-test-sftpgo
    ports:
      - "2240:2022"
      - "18091:8080"
    environment:
      # `debug` so the log carries the refused public-key offer, not just a
      # summary line — the measurement quotes that log line.
      - SFTPGO_LOG_LEVEL=debug
      # The image ships `create_default_admin: false`, so without this the
      # REST API has no account to authenticate `sftpgo-init` with.
      - SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN=true
      - SFTPGO_DEFAULT_ADMIN_USERNAME=macscpadmin
      - SFTPGO_DEFAULT_ADMIN_PASSWORD=macscpsecretkey
    volumes:
      - ./seed:/data/seed:ro

  # One-shot seeding for `sftpgo`, in the spirit of `s3-init` above: waits
  # for the admin API, then creates `testuser` unless it is already there. See
  # the comments in ./sftpgo/init.sh for the idempotency argument.
  sftpgo-init:
    image: curlimages/curl:8.9.1
    container_name: macscp-test-sftpgo-init
    depends_on:
      - sftpgo
    volumes:
      - ./sftpgo:/seed:ro
    entrypoint: ["/bin/sh", "/seed/init.sh"]
