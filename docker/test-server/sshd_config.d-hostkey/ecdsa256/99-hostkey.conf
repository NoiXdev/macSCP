# macSCP testrig: the integration tests deliberately provoke failed logins
# (wrong password, TOFU reject). Without this, OpenSSH >= 9.8
# PerSourcePenalties accumulates against 127.0.0.1 and starts rejecting new
# connections outright ("Disconnected") after many test runs, until the
# container is restarted.
PerSourcePenalties no

# Many rapid, partly unauthenticated test connections must not be dropped
# at random. The three-field form this line used to carry, 100:30:200, did
# exactly that: from 100 unauthenticated connections on, sshd refuses 30%
# of new ones, CHOSEN AT RANDOM. A single number has no such band — every
# connection up to the limit is accepted, and past it refused outright.
#
# Measured 2026-09-27 (docs/BACKLOG.md, "Three SSH-rig cases go red under
# the full gated run"): sshd's own listener counter, which `ps` inside the
# container prints as "N of 100-200 startups", climbs monotonically through
# one gated run - sampled once a second, 0 to 90 over 136 s — because the
# probes connect and close far faster than Docker Desktop's port forwarder
# releases the container side. Above 100 the greylisting band then refuses
# a random 30%, which is the whole of the symptom: a different subset of
# SSH cases red every run, all of them green in isolation.
MaxStartups 1000

# M10c/T1: jump-host tests need a direct-tcpip channel (ProxyJump, Citadel
# SSHClient.jump(to:)) from the jump container to the target container. The
# base image sets "AllowTcpForwarding no" — without this, sshd rejects the
# channel with "channelSetupRejected" before target authentication even
# begins.
AllowTcpForwarding yes

# Host-key-types rig (2026-09-02): restrict the server to offering exactly
# one host-key algorithm, so ssh-keyscan against this port proves which type
# the client actually negotiated. The shared `sshd`/`sshd2` services offer
# all three types the base image generates at once, which is why every test
# against them negotiates ed25519 regardless of which type is under test.
HostKeyAlgorithms ecdsa-sha2-nistp256
